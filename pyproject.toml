[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-pole-measure"
version = "0.1.0"
description = "Detect poles in LAS/LAZ and export GIS pole positions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "laspy[lazrs]>=2.5.4",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "pyproj>=3.6.1",
  "Pillow>=10.4.0",
  "pyshp>=2.3.1",
  "shapely>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
